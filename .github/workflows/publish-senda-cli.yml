name: Publish Senda CLI

on:
  workflow_dispatch:
  push:
    tags:
      - "senda-cli-v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/senda-cli-v')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/senda-cli
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - run: npm test
      - run: npm run pack:check
      - run: npm publish --access public
